<!DOCTYPE html>
<html lang="zh">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<title>預設規劃方案 - Planboid: Project Zomboid 地塊規劃器</title>

		<!-- Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&family=Noto+Serif+TC:wght@200..900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

		<!-- CSS Style -->
		<link rel="stylesheet" href="css/style.css">

		<!-- Favicon -->
		<link
			rel="icon"
			href="data:image/x-icon;base64,AAABAAEAEBAQAAEABAAoAQAAFgAAACgAAAAQAAAAIAAAAAEABAAAAAAAgAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAA6MObAP+EAAChe1IA////AH1KFAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADVVVVVVVVUAEiIiIiIiJQASREJEREIlABIiIkIiQiUAEkRCQiJCJQASQkJEREIlABJCIiIiIiUAEiQiJEQiJQASRCQiIiQlABJCIkIiQiUAEiQiJCQiJQASIiIiQiIlABIiIiIiIiUAEREREREREwAAAAAAAAAAD//wAAgAEAAIABAACAAQAAgAEAAIABAACAAQAAgAEAAIABAACAAQAAgAEAAIABAACAAQAAgAEAAIABAAD//wAA"
		>

		<!-- 靜態語言字典檔 (100% 離線 file:// 相容) -->
		<script src="lang/zh.js"></script>
		<script src="lang/en.js"></script>
	</head>
	<body>
		<div id="app-container">
			<!-- 頂部標題與控制列 -->
			<header class="app-header">
				<div class="logo-area">
					<img class="logo-icon" src="img/logo.svg" alt="Planboid Logo">
					<h1 class="logo-title desktop-only">Planboid</h1>
					<span class="badge desktop-only" data-i18n="header_badge">Project Zomboid 地塊規劃器</span>

					<!-- 語言切換選單 (置於 logo-area 區塊右側) -->
					<select id="select-lang" class="select-lang" title="切換顯示語言 / Change Language">
						<option value="zh">中文</option>
						<option value="en">English</option>
					</select>
				</div>

				<div class="header-center">
					<span class="scheme-title" id="active-scheme-name" data-i18n-title="header_scheme_name_tooltip" title="點擊重新命名與調整尺寸"
					>預設規劃方案</span>
					<span class="scheme-dim desktop-only" id="active-scheme-dim">(32 x 32 @ 10500,9200)</span>

					<button class="btn btn-icon-text" id="btn-scheme-modal">
						<span>📁 <span class="btn-text" data-i18n="header_btn_scheme">方案</span></span>
					</button>
				</div>

				<div class="header-actions">
					<button class="btn" id="btn-about" data-i18n-title="header_btn_about_title" title="關於專案與團隊致謝">
						ℹ️ <span class="btn-text" data-i18n="header_btn_about">關於</span>
					</button>
					<a
						class="btn"
						id="btn-github-repo"
						href="https://github.com/HouMuYi/Planboid"
						target="_blank"
						rel="noopener"
						data-i18n-title="header_btn_github_title"
						title="造訪 GitHub 原始碼倉庫"
					>⭐</a>
					<button class="btn" id="btn-export-svg" data-i18n-title="header_btn_svg_title" title="匯出高畫質向量 SVG 圖檔 (含圖例)">
						📐 <span class="btn-text" data-i18n="header_btn_svg">SVG</span>
					</button>
					<button class="btn" id="btn-export-png" data-i18n-title="header_btn_png_title" title="匯出全幅 PNG 圖片快照">
						📷 <span class="btn-text" data-i18n="header_btn_png">PNG</span>
					</button>
					<button class="btn" id="btn-export-json" data-i18n-title="header_btn_export_json_title" title="將方案匯出為 JSON 檔案">💾</button>
					<button class="btn" id="btn-import-json" data-i18n-title="header_btn_import_json_title" title="從本機讀取 JSON 檔案匯入">
						📂
					</button>
					<button
						class="btn"
						id="btn-export-clipboard"
						data-i18n-title="header_btn_export_clipboard_title"
						title="將方案極簡文字複製至剪貼簿"
					>
						📄
					</button>
					<button class="btn" id="btn-import-text" data-i18n-title="header_btn_import_text_title" title="貼上或輸入方案極簡文字匯入">
						📋
					</button>
				</div>
			</header>

			<!-- 主視圖區塊 -->
			<main class="app-body">
				<!-- 左側主要工具列 -->
				<aside class="toolbar-left panel" id="main-toolbar">
					<div class="tool-group">
						<span class="group-label desktop-only" data-i18n="toolbar_group_tools">畫具</span>
						<button
							class="tool-btn active"
							id="tool-floor"
							data-tool="floor"
							data-i18n-title="toolbar_tool_floor_title"
							title="繪製地塊（1）&#10;點擊單一地塊立即上色；按住拖曳後放開，可依起訖對角批次為矩形範圍地塊上色。"
						>
							<span class="icon unicode-icon">◆</span>
						</button>
						<button
							class="tool-btn"
							id="tool-wall"
							data-tool="wall"
							data-i18n-title="toolbar_tool_wall_title"
							title="繪製邊線（2）&#10;遊標會自動吸附至地塊網格交叉點；點擊一交叉點作為起點後，按住拖曳到另一交叉點放開，或放開後移動再次點擊，皆可沿水平或垂直單一直線批次繪製整排邊線；按 Esc 可中斷。"
						>
							<span class="icon unicode-icon">◇</span>
						</button>
						<button
							class="tool-btn"
							id="tool-erase-floor"
							data-tool="erase-floor"
							data-i18n-title="toolbar_tool_erase_floor_title"
							title="清除地塊（3）&#10;操作邏輯與繪製地塊相同：點擊單一地塊立即清除；按住拖曳後放開，可清除起訖對角所框出之矩形範圍內全部地塊。"
						>
							<span class="icon combo-icon">
								<span class="base-icon">◆</span>
								<span class="overlay-icon">✘</span>
							</span>
						</button>
						<button
							class="tool-btn"
							id="tool-erase-wall"
							data-tool="erase-wall"
							data-i18n-title="toolbar_tool_erase_wall_title"
							title="清除邊線（4）&#10;操作邏輯與繪製邊線相同：吸附交叉點設定起點後，拖曳或再次點擊終點，即可沿同一水平或垂直直線批次清除整排邊線。"
						>
							<span class="icon combo-icon">
								<span class="base-icon">◇</span>
								<span class="overlay-icon">✘</span>
							</span>
						</button>
						<button
							class="tool-btn"
							id="tool-select"
							data-tool="select"
							data-i18n-title="toolbar_tool_select_title"
							title="選取工具（5）&#10;點擊單一地塊即可選取並編輯標籤；按住拖曳後放開，可框選矩形範圍地塊，供複製（Ctrl+C）、貼上（Ctrl+V）或刪除（Delete）使用。"
						>
							<span class="icon">👆</span>
						</button>
					</div>

					<hr class="divider desktop-only">

					<div class="tool-group desktop-only">
						<span class="group-label" data-i18n="toolbar_group_history">歷史</span>
						<button class="btn btn-icon" id="btn-undo" data-i18n-title="toolbar_btn_undo_title" title="復原 (Ctrl+Z)">↩️</button>
						<button class="btn btn-icon" id="btn-redo" data-i18n-title="toolbar_btn_redo_title" title="重做 (Ctrl+Y)">↪️</button>
					</div>
				</aside>

				<!-- 中央 Canvas 畫布區塊 -->
				<section class="canvas-viewport" id="canvas-container">
					<canvas id="main-canvas"></canvas>

					<div class="view-overlay-controls">
						<div class="view-switch-group">
							<button class="btn active" id="view-iso" data-i18n-title="viewport_view_iso_title" title="2:1 等軸測視角">
								<span data-i18n="viewport_view_iso">等軸測（2:1）</span>
							</button>
							<button class="btn" id="view-ortho" data-i18n-title="viewport_view_ortho_title" title="1:1 正交視角">
								<span data-i18n="viewport_view_ortho">正交（1:1）</span>
							</button>
						</div>

						<button class="btn btn-circle" id="btn-fit-view" data-i18n-title="viewport_btn_fit_view_title" title="顯示全部畫布與地塊">
							🔍
						</button>
						<button class="btn btn-circle" id="btn-reset-view" data-i18n-title="viewport_btn_reset_view_title" title="重設視角與縮放">
							🎯
						</button>
					</div>

					<div class="canvas-info-overlay">
						<span id="info-coords">網格: (1, 1), Z: 0F</span>
						<span class="dot desktop-only">•</span>
						<span id="info-game-coords" class="desktop-only text-accent">PZ座標: (10500, 9200)</span>
						<span class="dot">•</span>
						<span id="info-zoom">Zoom: 100%</span>
					</div>

					<div class="canvas-info-overlay canvas-hotkeys-overlay desktop-only" id="canvas-hotkey-legend"></div>
				</section>

				<!-- 右側側邊欄 -->
				<aside class="sidebar-right panel" id="main-sidebar">
					<button class="btn btn-toggle-sidebar" id="btn-toggle-sidebar" data-i18n-title="sidebar_btn_toggle_title" title="摺疊/展開側邊欄">
						<span class="toggle-icon">⇄</span>
						<span class="toggle-text" data-i18n="sidebar_btn_toggle">側邊欄</span>
					</button>

					<div class="sidebar-scroll-content">
						<div class="panel-section floor-control-section">
							<h3 class="section-title" data-i18n="sidebar_floor_control_title">樓層控制（Z-Level）</h3>
							<div class="floor-selector">
								<button
									class="btn"
									id="floor-up"
									data-i18n="sidebar_floor_up"
									data-i18n-title="sidebar_floor_up_title"
									title="▲ 上層"
								>
									▲ 上層
								</button>
								<div class="floor-indicator">
									<span class="floor-label" id="current-floor-display">1</span>
								</div>
								<button
									class="btn"
									id="floor-down"
									data-i18n="sidebar_floor_down"
									data-i18n-title="sidebar_floor_down_title"
									title="▼ 下層"
								>
									▼ 下層
								</button>
							</div>
							<div class="other-floors-control">
								<div class="field-label-text micro-text subtle-text floor-mode-label" data-i18n="sidebar_other_floors_label">其他樓層顯示：</div>
								<div class="segmented-control" id="other-floors-group">
									<button
										class="btn btn-segmented"
										data-mode="hidden"
										data-i18n="sidebar_other_floors_hidden"
										data-i18n-title="sidebar_other_floors_hidden_title"
										title="隱藏其他所有樓層"
									>
										隱藏
									</button>
									<button
										class="btn btn-segmented active"
										data-mode="ghost"
										data-i18n="sidebar_other_floors_ghost"
										data-i18n-title="sidebar_other_floors_ghost_title"
										title="以半透明鬼影呈現其他樓層"
									>
										虛影
									</button>
									<button
										class="btn btn-segmented"
										data-mode="solid"
										data-i18n="sidebar_other_floors_solid"
										data-i18n-title="sidebar_other_floors_solid_title"
										title="完整顯示其他樓層"
									>
										完整
									</button>
								</div>
							</div>
							<label
								class="toggle-pill"
								data-i18n-title="viewport_toggle_3d_walls_title"
								title="立體牆面"
							>
								<input type="checkbox" id="chk-3d-walls" checked>
								<span data-i18n="viewport_toggle_3d_walls">立體牆面</span>
							</label>
						</div>

						<hr class="divider">

						<!-- 通用調色盤區塊 -->
						<div class="panel-section palette-section">
							<div class="section-header">
								<h3 class="section-title" data-i18n="sidebar_palette_title">通用調色盤</h3>
								<button class="btn" id="btn-add-palette" data-i18n="sidebar_btn_add_palette">+ 新增色塊</button>
							</div>
							<div class="palette-list" id="palette-container"></div>
						</div>

						<hr class="divider">

						<!-- 物件調色盤區塊 -->
						<div class="panel-section object-palette-section">
							<div class="section-header">
								<h3 class="section-title" data-i18n="sidebar_object_palette_title">物件調色盤</h3>
								<button class="btn" id="btn-add-object-palette" data-i18n="sidebar_btn_add_object_palette">+ 新增物件</button>
							</div>
							<div class="palette-list" id="object-palette-container"></div>
						</div>

						<hr class="divider">

						<!-- 區域與標籤區塊 -->
						<div class="panel-section label-section">
							<div class="section-header">
								<h3 class="section-title" data-i18n="sidebar_label_title">區域與標籤</h3>
								<button
									class="btn"
									id="btn-enable-select"
									data-i18n="sidebar_btn_enable_select"
									data-i18n-title="sidebar_btn_enable_select_title"
									title="快捷進入選取模式"
								>
									👆 點擊選取
								</button>
							</div>
							<div class="selected-tile-info text-muted" id="selected-tile-info" data-i18n="sidebar_no_selected_tile">
								未選擇地塊 (點擊上方按鈕進入選取)
							</div>
							<input
								type="text"
								id="input-tile-label"
								class="input-text"
								data-i18n-placeholder="sidebar_label_input_placeholder"
								placeholder="例如：廚房、主臥室、儲藏室"
								disabled
							>
						</div>
					</div>
					</div>
				</aside>
			</main>
		</div>

		<!-- 關於 Modal -->
		<dialog class="app-modal" id="modal-about">
			<div class="modal-content panel modal-xl">
				<div class="modal-header">
					<h2 class="modal-title-text" data-i18n="modal_about_title">關於專案</h2>
					<button class="btn-close" id="btn-close-about-modal">✕</button>
				</div>
				<div class="modal-body" id="about-markdown-body"></div>
			</div>
		</dialog>

		<!-- 方案管理 Modal (與建立/編輯方案同 UI 盒體) -->
		<dialog class="app-modal" id="modal-schemes">
			<div class="modal-content panel modal-lg">
				<div class="modal-header">
					<h2 data-i18n="modal_schemes_title">方案管理</h2>
					<button class="btn-close" id="btn-close-scheme-modal">✕</button>
				</div>
				<div class="modal-body stack">
					<!-- 儲存容量監控盒體 (HTML5 原生 meter 語義標籤與 OOCSS .box 物件) -->
					<div class="scheme-storage-box box stack">
						<div class="cluster cluster-between">
							<div class="cluster">
								<span
									class="icon-help-badge"
									id="scheme-storage-help-icon"
									data-i18n-title="modal_schemes_storage_capacity_tooltip"
									title="受限於瀏覽器標準規範，LocalStorage 的硬性容量上限通常固定為 5 MB。本工具雖已對資料進行極致壓縮，但上限仍由瀏覽器決定。若空間不足請匯出 JSON 備份——跟作者哭小是沒用的，請找 W3C 與 WHATWG 哭訴。"
								>?</span>
								<label for="scheme-storage-meter" class="field-label" data-i18n="modal_schemes_storage_capacity">儲存空間：</label>
							</div>
							<span class="micro-text text-muted" id="scheme-storage-text">0 KB / 5 MB (0%)</span>
						</div>
						<meter
							id="scheme-storage-meter"
							class="meter"
							min="0"
							max="100"
							value="0"
						></meter>
					</div>

					<!-- 方案編輯/建立盒體 -->
					<div class="scheme-create-box box stack">
						<input type="hidden" id="scheme-editor-id" value="">
						<div class="cluster cluster-between">
							<span id="scheme-editor-title" class="section-title text-accent" data-i18n="modal_schemes_create_title">建立自訂新方案</span>
						</div>
						<div class="cluster">
							<input
								type="text"
								id="new-scheme-name"
								class="input-text flex-2"
								data-i18n-placeholder="modal_schemes_name_placeholder"
								placeholder="方案名稱"
							>
							<input
								type="number"
								id="new-scheme-width"
								class="input-text flex-1"
								data-i18n-placeholder="modal_schemes_width_placeholder"
								placeholder="寬"
								value="64"
							>
							<span class="input-prefix">x</span>
							<input
								type="number"
								id="new-scheme-height"
								class="input-text flex-1"
								data-i18n-placeholder="modal_schemes_height_placeholder"
								placeholder="高"
								value="64"
							>
						</div>
						<div class="cluster">
							<span class="input-prefix" data-i18n="header_world_origin_x">PZ 原點 X：</span>
							<input type="number" id="new-scheme-world-x" class="input-text flex-1" placeholder="10500" value="10500">
							<span class="input-prefix" data-i18n="header_world_origin_y">Y：</span>
							<input type="number" id="new-scheme-world-y" class="input-text flex-1" placeholder="9200" value="9200">
						</div>
						<div class="cluster">
							<button class="btn btn-primary flex-1" id="btn-save-scheme-editor" data-i18n="modal_schemes_btn_create">
								建立新方案
							</button>
							<button class="btn flex-1" id="btn-save-as-new-scheme" style="display: none" data-i18n="modal_schemes_btn_save_as_new">
								另存新方案
							</button>
						</div>
					</div>
					<!-- 內建文字貼上與匯入盒體 (零原生彈窗) -->
					<div class="scheme-text-import-box box stack" id="box-text-import" style="display: none">
						<span class="section-title text-accent" data-i18n="prompt_import_text_title">請貼上或輸入方案文字內容：</span>
						<textarea
							id="input-text-scheme-data"
							class="input-text input-code"
							rows="3"
							data-i18n-placeholder="prompt_import_text_placeholder"
							placeholder="{ &quot;n&quot;: &quot;...&quot; }"
						></textarea>
						<div class="cluster cluster-end">
							<button id="btn-cancel-text-import" class="btn" data-i18n="modal_confirm_cancel">取消</button>
							<button id="btn-submit-text-import" class="btn btn-primary" data-i18n="header_btn_import_text">貼上文字</button>
						</div>
					</div>
					<ul class="scheme-list" id="scheme-list-container"></ul>
				</div>
			</div>
		</dialog>

		<!-- 色塊 Modal -->
		<dialog class="app-modal" id="modal-palette-edit">
			<div class="modal-content panel modal-sm">
				<div class="modal-header">
					<h2 id="palette-modal-title" data-i18n="modal_palette_title_edit">編輯色塊</h2>
					<button class="btn-close" id="btn-close-palette-modal">✕</button>
				</div>
				<div class="modal-body stack">
					<input type="hidden" id="edit-palette-id">
					<div>
						<label class="field-label" data-i18n="modal_palette_label_name">色塊名稱：</label>
						<input
							type="text"
							id="edit-palette-name"
							class="input-text"
							data-i18n-placeholder="modal_palette_name_placeholder"
							placeholder="例如：水泥地面"
						>
					</div>
					<div class="stack">
						<label class="field-label" data-i18n="modal_palette_label_color">選擇顏色：</label>
						<div class="cluster">
							<input type="color" id="edit-palette-color" class="input-color">
							<input type="text" id="edit-palette-hex" class="input-text input-code flex-1" placeholder="#6366F1">
						</div>
						<div id="preset-color-swatches"></div>
					</div>
					<div class="cluster cluster-between">
						<button class="btn btn-danger" id="btn-delete-palette" data-i18n="modal_palette_btn_delete">
							刪除色塊
						</button>
						<div class="cluster">
							<button class="btn btn-secondary" id="btn-convert-palette-type" data-i18n="modal_palette_btn_convert_to_object">轉為物件色票</button>
							<button class="btn btn-primary" id="btn-save-palette" data-i18n="modal_palette_btn_save">儲存變更</button>
						</div>
					</div>
				</div>
			</div>
		</dialog>

		<!-- 全站通用二次確認 Modal (替代原生 confirm) -->
		<dialog class="app-modal" id="modal-confirm">
			<div class="modal-content panel modal-md">
				<div class="modal-header">
					<h2 id="confirm-modal-title" class="modal-title-text text-danger" data-i18n="modal_confirm_title">⚠️ 操作確認</h2>
					<button class="btn-close" id="btn-close-confirm-modal">✕</button>
				</div>
				<div class="modal-body stack">
					<p id="confirm-modal-message"></p>
					<div class="cluster cluster-end">
						<button class="btn" id="btn-confirm-cancel" data-i18n="modal_confirm_cancel">取消</button>
						<button class="btn btn-danger" id="btn-confirm-ok" data-i18n="modal_confirm_ok">
							確定刪除
						</button>
					</div>
				</div>
			</div>
		</dialog>

		<!-- JS ES Module -->
		<script type="module" src="js/main.js"></script>
	</body>
</html>
